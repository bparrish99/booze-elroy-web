<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Booze Elroy Activity</title>
<!-- The author's secret page (web edition): who signed up, logged in, earned achievements, played. Opened as
     /activity.html#<admin password> (the part after # is never sent anywhere but as the key below); the data comes
     from GET /api/account/activity, which checks LEADERBOARD_ADMIN_PASSWORD. Built from template/activity.html. -->
<style>
:root{--bg:#000;--fg:#ffd400;--dim:#a8a8a8;--line:#2121de;--pink:#ffb8ff;--cyan:#00ffff;--white:#dedeff}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Courier New",monospace}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:18px;letter-spacing:.15em}
.sub{color:var(--dim);margin:0 0 18px}
.box{border:2px solid var(--line);border-radius:6px;padding:14px 16px;margin:0 0 16px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px}
.stats b{display:block;font-size:22px;color:var(--white);font-weight:normal}
.stats span{color:var(--dim);font-size:13px}
.accts{display:flex;flex-wrap:wrap;gap:6px 14px}
button.name{all:unset;cursor:pointer;color:var(--pink)}
button.name:hover,button.name:focus-visible{text-decoration:underline}
button.name.on{background:var(--pink);color:#000;padding:0 3px}
table{width:100%;border-collapse:collapse}
td{padding:4px 8px 4px 0;vertical-align:top;border-top:1px solid #1a1a3a}
td.t{color:var(--dim);white-space:nowrap;width:1%}
td.w{white-space:nowrap;width:1%}
.k-signup{color:var(--cyan)}.k-score,.k-arenascore{color:var(--pink)}.k-score b,.k-arenascore b{color:var(--white);font-weight:normal}.k-achievement{color:var(--fg)}.k-login,.k-played{color:var(--white)}.k-game{color:var(--dim)}.k-game b{color:var(--white);font-weight:normal}
.day td{border-top:0;padding-top:14px;color:var(--dim);font-size:13px;letter-spacing:.1em}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:6px 8px;background:#111;color:#fff;border:1px solid #555;border-radius:3px;font:inherit}
form button,.bar button{padding:6px 14px;background:var(--fg);color:#000;border:1px solid var(--fg);border-radius:3px;font:inherit;cursor:pointer}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.bar button{background:#111;color:var(--fg)}
.msg{color:var(--pink);min-height:1.4em}
.live{color:var(--dim);font-size:13px}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3c3;margin-right:6px;vertical-align:1px}
.live.off i{background:#c33}
tr.new td{animation:glow 6s ease-out}
@keyframes glow{from{background:#2a2a00}to{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.new td{animation:none;background:#1a1a00}}
[hidden]{display:none!important}
</style></head><body><main>
<h1>BOOZE ELROY ACTIVITY</h1>
<p class="sub">Accounts, logins, games (with their settings), scores and achievements, newest first. Times are your local time. Checks for new activity every 30 seconds.</p>
<div id="ask" class="box" hidden>
  <form id="pw"><label>Password <input type="password" name="pw" autocomplete="current-password"></label><button>Show</button></form>
  <div class="msg" id="askMsg"></div>
</div>
<div id="out" hidden>
  <div class="box stats" id="stats"></div>
  <div class="box"><div class="bar"><strong>ACCOUNTS</strong> <span class="sub" id="filterNote" style="margin:0"></span><button id="clear" hidden>Show everyone</button></div><div class="accts" id="accts"></div></div>
  <div class="box"><div class="bar"><strong>ACTIVITY</strong><button id="reload">Refresh</button><span class="live" id="live"></span></div><table><tbody id="log"></tbody></table></div>
</div>
<div class="msg" id="msg"></div>
</main>
<script>
(() => {
  const ACH = Object.fromEntries([["quarter","spent a quarter"],["respects","pay respects"],["stylish","stylish"],["park","walk in the park"],["kind","be kind"],["dedication","dedication"],["martini","peer pressure"],["streak","one week chip"],["scratch","without a scratch 1"],["scratch2","without a scratch 2"],["scratch3","without a scratch 3"],["fever","pac-man fever"],["clyde","clyde"],["inky","inky"],["pinky","pinky"],["blinky","blinky"],["haunted","house of horrors 1"],["haunted2","house of horrors 2"],["haunted3","house of horrors 3"],["terror","house of terrors 1"],["terror2","house of terrors 2"],["terror3","house of terrors 3"],["afterdark","after dark 1"],["afterdark2","after dark 2"],["afterdark3","after dark 3"],["rocketman","rocketman 1"],["rocketman2","rocketman 2"],["rocketman3","rocketman 3"],["coke","coke and a smile 1"],["coke2","coke and a smile 2"],["coke3","coke and a smile 3"],["booze","best mazes ever 1"],["booze2","best mazes ever 2"],["booze3","best mazes ever 3"],["seven","desaturating seven 1"],["seven2","desaturating seven 2"],["seven3","desaturating seven 3"],["yolo","yolo 1"],["yolo2","yolo 2"],["yolo3","yolo 3"],["photo","photographic memory 1"],["photo2","photographic memory 2"],["photo3","photographic memory 3"],["elephant","elephantine memory"],["arena","party animal"],["planner","party planner"],["dinner","chicken dinner"],["trailblazer","trailblazer"],["billy","billy mitchell"],["pug","booze pug"],["beagle","booze beagle"],["boxer","booze boxer"],["hound","booze hound"],["wake","time to wake up"],["neil","neil rogers"]]);
  const $ = (id) => document.getElementById(id);
  let key = decodeURIComponent(location.hash.slice(1)), data = null, who = null;
  // auto-refresh: every 30 s (and at once when the tab comes back); events not seen before light up, and while the tab
  // is in the background the title counts them
  const EVERY = 30000, TITLE = document.title;
  const idOf = (e) => e.at + "|" + e.type + "|" + e.name + "|" + e.detail;
  let seen = null, fresh = new Set(), unseen = 0, timer = null, lastOk = 0;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const what = (e) => e.type === "signup" ? "created an account" : e.type === "login" ? "logged in"
    : e.type === "achievement" ? "earned <b>" + esc((ACH[e.detail] || e.detail).toUpperCase()) + "</b>"
    : e.type === "game" ? gameText(e)
    : e.type === "played" ? "played today" + (Number(e.detail) > 1 ? " (" + Number(e.detail) + " days in a row)" : "")
    : e.type === "score" || e.type === "arenascore" ? scoreText(e) : esc(e.type);
  // [rank, score, settings | arena name]
  function scoreText(e) {
    let d; try { d = JSON.parse(e.detail); } catch { return esc(e.detail); }
    const [rank, score, where] = Array.isArray(d) ? d : [];
    return "placed <b>#" + esc(rank) + "</b> with <b>" + esc(Number(score).toLocaleString()) + "</b> " + (e.type === "arenascore" ? "in the arena <b>" + esc(String(where).toUpperCase()) + "</b>" : "on " + esc(where));
  }
  // [settings, streak (first game of the day) or 0, arena name or ""]
  function gameText(e) {
    let d; try { d = JSON.parse(e.detail); } catch { return esc(e.detail); }
    const [settings, streak, arena] = Array.isArray(d) ? d : [];
    return "played " + (arena ? "in the arena <b>" + esc(String(arena).toUpperCase()) + "</b>: " : "") + "<b>" + esc(settings || "?") + "</b>"
      + (Number(streak) > 0 ? " (first game today" + (Number(streak) > 1 ? ", " + Number(streak) + " days in a row" : "") + ")" : "");
  }
  const dayOf = (d) => d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  function render() {
    const ev = data.events.filter((e) => !who || e.name === who), now = Date.now(), day = 864e5;
    const since = (ms, t) => data.events.filter((e) => (!t || e.type === t) && now - Date.parse(e.at) < ms).length;
    const active = new Set(data.events.filter((e) => now - Date.parse(e.at) < day).map((e) => e.name)).size;
    $("stats").innerHTML = [[data.accounts.length, "accounts"], [active, "active today"], [since(day, "signup"), "signups today"],
      [since(day, "login"), "logins today"], [since(day, "game"), "games today"], [since(day, "achievement"), "achievements today"], [since(7 * day, "signup"), "signups this week"]]
      .map(([n, l]) => "<div><b>" + n + "</b><span>" + l + "</span></div>").join("");
    $("accts").innerHTML = data.accounts.length ? data.accounts.map((n) => '<button class="name' + (n === who ? " on" : "") + '" data-n="' + esc(n) + '">' + esc(n) + "</button>").join("") : '<span class="sub">none yet</span>';
    $("filterNote").textContent = who ? "showing " + who : "click a name to see just theirs";
    $("clear").hidden = !who;
    let html = "", last = "";
    for (const e of ev) {
      const d = new Date(e.at), dk = d.toDateString();
      if (dk !== last) { html += '<tr class="day"><td colspan="3">' + esc(dayOf(d).toUpperCase()) + "</td></tr>"; last = dk; }
      html += '<tr' + (fresh.has(idOf(e)) ? ' class="new"' : "") + '><td class="t">' + esc(d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })) + '</td><td class="w"><button class="name" data-n="' + esc(e.name) + '">' + esc(e.name) + '</button></td><td class="k-' + esc(e.type) + '">' + what(e) + "</td></tr>";
    }
    $("log").innerHTML = html || '<tr><td class="sub">nothing yet</td></tr>';
  }
  const clock = (t) => new Date(t).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
  function schedule() { clearTimeout(timer); timer = setTimeout(() => load(true), EVERY); }
  async function load(auto) {
    if (!auto) $("msg").textContent = "Loading…";
    let r = null;
    try { r = await fetch("/api/account/activity", { headers: { "x-admin-key": key }, cache: "no-store" }); } catch { r = null; }
    if (r && r.ok) {
      data = await r.json();
      const ids = data.events.map(idOf);
      fresh = seen ? new Set(ids.filter((i) => !seen.has(i))) : new Set(); // nothing lights up on the first load
      seen = new Set(ids);
      if (fresh.size) setTimeout(() => fresh.clear(), 6500); // after the glow, so a re-render (a name clicked) doesn't replay it
      if (document.hidden) { unseen += fresh.size; document.title = (unseen ? "(" + unseen + ") " : "") + TITLE; }
      lastOk = Date.now();
      $("live").className = "live"; $("live").innerHTML = "<i></i>updated " + esc(clock(lastOk));
      $("msg").textContent = ""; $("ask").hidden = true; $("out").hidden = false; render(); schedule(); return;
    }
    if (auto && data && (!r || r.status >= 500)) { // a hiccup while watching: keep what's on screen, try again later
      $("live").className = "live off"; $("live").innerHTML = "<i></i>can't reach the server, last updated " + esc(clock(lastOk)) + ", retrying";
      schedule(); return;
    }
    clearTimeout(timer);
    $("msg").textContent = "";
    $("out").hidden = true; $("ask").hidden = false;
    $("askMsg").textContent = !key ? "" : !r ? "Can't reach the server." : r.status === 403 ? "Wrong password." : r.status === 503 ? "No admin password is set on the server." : "That didn't work (" + r.status + ").";
  }
  $("pw").addEventListener("submit", (e) => { e.preventDefault(); key = e.target.elements.pw.value; history.replaceState(null, "", "#" + encodeURIComponent(key)); load(); });
  document.addEventListener("click", (e) => { const b = e.target.closest("button.name"); if (b) { who = who === b.dataset.n ? null : b.dataset.n; render(); } });
  $("clear").addEventListener("click", () => { who = null; render(); });
  $("reload").addEventListener("click", () => load());
  window.__refresh = () => load(true); // tests: an auto-refresh now
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unseen = 0; document.title = TITLE; if (data) load(true); } });
  load();
})();
</script>
</body></html>
