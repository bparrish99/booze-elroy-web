<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Booze Elroy</title>
<style>
html,body{overscroll-behavior:none;margin:0;height:100%;background:#000;color:#ffd400;overflow:hidden;font-family:"Courier New",monospace}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#fps{display:none;position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));z-index:5;font:bold 15px/1.25 "Courier New",monospace;color:#b4b4b4;opacity:.85;white-space:pre;text-shadow:0 0 3px #000;pointer-events:none;-webkit-user-select:none;user-select:none}
#fps.on{display:block}
#bezel{display:none;position:absolute;inset:0;width:100%;height:100%}
#screen{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#fs{display:none;position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:calc(max(8px,env(safe-area-inset-left,0px)) + 88px);z-index:5;width:44px;height:44px;padding:0;border:0;background:none;color:#a8a8a8;font:28px/44px Arial,Helvetica,sans-serif;text-align:center;text-shadow:0 0 3px #000;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;opacity:.55;transition:opacity .2s}
#fs.on{display:block}
#pop{display:none;position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:calc(max(8px,env(safe-area-inset-left,0px)) + 132px);z-index:5;width:44px;height:44px;padding:10px;border:0;background:none;color:#a8a8a8;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;opacity:.55;transition:opacity .2s;filter:drop-shadow(0 0 2px #000)}
#pop.on{display:block}
#pop svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pop:hover,#pop:focus-visible{opacity:.9}
/* in the pop-out window the controls would sit on the picture: none there (keys: C, F, Esc, M in a game) */
body.popout #vol,body.popout #look,body.popout #fs,body.popout #esc{display:none!important}
#popped{display:none;position:absolute;inset:0;z-index:7;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
#popped.on{display:flex}
#popped .box{text-align:center}
#popped .row{display:flex;justify-content:center;margin-top:14px}
#vol{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:6;width:44px}
#mute{display:block;width:44px;height:44px;padding:9px;border:0;background:none;color:#a8a8a8;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;opacity:.55;transition:opacity .2s;filter:drop-shadow(0 0 2px #000)}
#mute svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mute .spk{fill:currentColor}
#mute .off,#mute.muted .on,#mute .lo{display:none}
#mute.muted .off{display:inline}
#mute.low:not(.muted) .lo{display:inline}#mute.low .hi{display:none}
#mute:hover,#mute:focus-visible,#vol.open #mute{opacity:.9}
#volPanel{display:none;justify-content:center;width:44px;padding:8px 0 10px;background:rgba(0,0,0,.6);border-radius:8px;touch-action:none}
#vol.open #volPanel{display:flex}
@media (hover:hover){#vol:hover #volPanel{display:flex}}
#volume{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:22px;height:120px;margin:0;padding:0 8px;background:linear-gradient(to top,#a8a8a8 var(--v,100%),#4a4a4a var(--v,100%)) center/4px 100% no-repeat;border-radius:2px;cursor:pointer;touch-action:none}
#volume::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#d0d0d0;border:0;box-shadow:0 0 3px #000}
#volume::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#d0d0d0;border:0;box-shadow:0 0 3px #000}
#volume::-moz-range-track{background:transparent}
#volume:focus{outline:none}#volume:focus-visible::-webkit-slider-thumb{background:#fff}
#look{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:calc(max(8px,env(safe-area-inset-left,0px)) + 44px);z-index:5;width:44px;height:44px;padding:9px;border:0;background:none;color:#a8a8a8;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;opacity:.55;transition:opacity .2s;filter:drop-shadow(0 0 2px #000)}
#look svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#look:hover,#look:focus-visible{opacity:.9}
#fs:hover,#fs:focus-visible,#esc:hover,#esc:focus-visible{opacity:.9}
#esc{display:none;position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:5;width:44px;height:44px;padding:0;border:0;background:none;color:#a8a8a8;font:28px/44px Arial,Helvetica,sans-serif;text-align:center;text-shadow:0 0 3px #000;touch-action:manipulation;-webkit-tap-highlight-color:transparent;opacity:.55;transition:opacity .2s}
#esc.on{display:block}
.box{background:#000;color:#ffd400;border:2px solid #2121de;border-radius:6px;padding:20px 22px;font:15px/1.5 "Courier New",monospace;max-width:min(320px,calc(100vw - 48px))}
.box::backdrop{background:rgba(0,0,0,.7)}
.box h2{margin:0 0 12px;font-size:16px;letter-spacing:.15em}
.box label{display:block;margin:6px 0}
.box input[type=password],.box input[type=text]{width:100%;box-sizing:border-box;margin-top:4px;padding:6px 8px;background:#111;color:#fff;border:1px solid #555;border-radius:3px;font:inherit}
.box .row{display:flex;flex-direction:row-reverse;gap:10px;justify-content:flex-start;margin-top:14px}
.box button{padding:6px 14px;background:#111;color:#ffd400;border:1px solid #ffd400;border-radius:3px;font:inherit;cursor:pointer}
.box button.go{background:#ffd400;color:#000}
.box .what{margin:0 0 8px;color:#fff}
.box .msg{min-height:1.5em;margin-top:8px;color:#ffb8ff}
.box [hidden]{display:none}
.box input[name=name]{text-transform:uppercase}
.box .switch{margin:12px 0 0;font-size:13px}.box .switch a{color:#a8a8ff}
#tip{display:none;position:fixed;z-index:8;max-width:min(260px,calc(100vw - 32px));padding:8px 11px;background:#000;color:#ffd400;border:2px solid #2121de;border-radius:6px;font:14px/1.4 "Courier New",monospace;pointer-events:none}
#tip.on{display:block}
#loading{position:absolute;color:#8a8a9a;letter-spacing:.2em;text-transform:uppercase;font-size:14px}

<div id="stage"><canvas id="bezel"></canvas><canvas id="screen"></canvas><div id="fps"></div><div id="loading">Loading…</div><div id="tip" role="tooltip"></div><div id="vol"><button id="mute" type="button" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9h4l5-4v14l-5-4H3z"/><path class="on lo" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="on hi" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9l6 6M22 9l-6 6"/></svg></button><div id="volPanel"><input id="volume" type="range" min="0" max="100" step="1" value="60" aria-label="Volume" title="Volume"></div></div><button id="fs" type="button" aria-label="Toggle fullscreen"title="Fullscreen (F)">⛶</button><button id="pop" type="button" aria-label="Pop out into its own window" title="Pop out into its own window"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></button><div id="popped" role="status"><div class="box"><div>Playing in the pop-out window.</div><div class="row"><button id="popBack" type="button" class="go">Play here instead</button></div></div></div><button id="look" type="button" aria-label="Change visuals" title="Change visuals (C)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg></button><button id="esc" type="button" aria-label="Exit to menu">✕</button></div>
<dialog id="reset" class="box"><form method="dialog"><h2>RESET HIGH SCORES</h2>
<p class="what" hidden></p>
<label class="scope"><input type="radio" name="scope" value="board" checked> Leaderboard for the current settings</label>
<label class="scope"><input type="radio" name="scope" value="all"> All leaderboards (every setting)</label>
<label>Password<input type="password" name="password" autocomplete="current-password"></label>
<div class="row"><button value="reset" class="go">Reset</button><button value="cancel" formnovalidate>Cancel</button></div>
<div class="msg" role="status"></div></form></dialog>
<dialog id="account" class="box"><form method="dialog"><h2>LOG IN</h2>
<div class="fields"><label>Username<input type="text" name="name" maxlength="16" autocomplete="username" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
<label>Password<input type="password" name="password" autocomplete="current-password"></label>
<label class="confirm">Password again<input type="password" name="password2" autocomplete="new-password"></label></div>
<div class="row"><button value="ok" class="go">Log in</button><button value="cancel" formnovalidate>Cancel</button></div>
<p class="switch"><a href="#">Create an account</a></p>
<div class="msg" role="status"></div></form></dialog>
